[package]
name = "nemlig-mcp"
version.workspace = true
edition.workspace = true
# Not inherited: rmcp needs 1.88, and raising the workspace floor would raise the
# library's too, for a dependency the library does not have.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server for the nemlig.com grocery API"
readme = "README.md"
keywords = ["nemlig", "mcp", "groceries", "denmark"]
categories = ["command-line-utilities", "api-bindings"]

[lints]
workspace = true

# What the release workflow attaches to the tag, spelled out so `cargo binstall` fetches
# one of those archives instead of building from source. One archive per target carries
# both binaries, so the stem is literal rather than `{ name }`: it does not vary by crate.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/nemlig-{ version }-{ target }.tar.gz"
bin-dir = "nemlig-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-url = "{ repo }/releases/download/v{ version }/nemlig-{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
clap = { workspace = true, features = ["derive", "env", "wrap_help"] }
directories = { workspace = true }
# default-features = false drops the CLI target and, with it, `place-order`: the feature
# is never enabled here, so order placement is not compiled into the server at all.
nemlig = { workspace = true, features = ["rustls-tls"] }
rmcp = { workspace = true, features = ["transport-io"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["io-util", "test-util"] }
wiremock = { workspace = true }
