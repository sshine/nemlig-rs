[project]
name = "nemlig-rs"
revision = "1.0"

# Credentials for the live API tests, which are #[ignore]d and only run via `just
# live-test`. Values come from whichever provider the developer configured; nothing
# secret belongs in this file.
[profiles.default]
NEMLIG_USERNAME = { description = "nemlig.com account email", required = true }
NEMLIG_PASSWORD = { description = "nemlig.com account password", required = true }
NEMLIG_TEST_BASKET = { description = "Set to opt into the live tests that change the account's real basket", required = false }
NEMLIG_TEST_PRODUCT_ID = { description = "Product id the basket tests add and then remove again, e.g. 5070417", required = false }
