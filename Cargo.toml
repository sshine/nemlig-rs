[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/nemlig-rs"
homepage = "https://github.com/sshine/nemlig-rs"

# Versions live here and the crates inherit them; feature sets stay with the crate that
# needs them, since those are what differ between members.
[workspace.dependencies]
# The version is required even for a path dependency: `cargo package --workspace` verifies
# every member's manifest and rejects a dependency without one, and without it the server
# would resolve against an older release from the registry rather than the sources beside
# it. `just check-version` keeps it level with the tag.
nemlig = { version = "0.1.0", path = "crates/nemlig", default-features = false }

chrono = { version = "0.4.45", default-features = false }
clap = "4.5.51"
cookie_store = { version = "0.22.1", default-features = false }
directories = "6.0.0"
reqwest = { version = "0.13.5", default-features = false }
reqwest_cookie_store = "0.10.0"
rmcp = "3.5.0"
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.20"
url = "2.5.8"
uuid = { version = "1.27.0", default-features = false }
wiremock = "0.6.5"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
